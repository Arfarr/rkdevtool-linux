name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 创建/更新 Release 需要写权限。很多仓库默认 token 是只读的，
# 不显式声明会直接 403。
permissions:
  contents: write

jobs:
  build:
    # 与开发环境保持一致：依赖包名（libqt5core5a 等）在 24.04 上是 t64 系列
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            qtbase5-dev libusb-1.0-0-dev fonts-noto-cjk \
            desktop-file-utils

      - name: 编译
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: 自检
        run: |
          # 用 Qt 的 offscreen 平台插件代替 xvfb：无需额外 X 服务，启动更快。
          # 不跑依赖真机的指令（ld/pl/di），CI 上没有硬件。
          env -u DISPLAY QT_QPA_PLATFORM=offscreen \
            ./build/RKDevTool --selftest --test-cmd="tab #text" \
            | tee selftest.log

      - name: 校验自检结果
        run: |
          # 字形检查必须为 0，否则说明控件文本被错误编码或缺中文字体
          grep -q "glyph-bad widgets=0" selftest.log \
            || { echo "::error::存在无法渲染的控件文本（中文乱码）"; grep "BAD " selftest.log || true; exit 1; }
          # 布局溢出同样是回归
          grep -q "layout overflow=0" selftest.log \
            || { echo "::error::布局溢出"; exit 1; }
          grep -q "中文OK" selftest.log \
            || { echo "::error::中文字体自检未通过"; exit 1; }

      - name: 校验桌面文件
        run: |
          # 桌面文件含 @EXEC@ 占位符，校验模板的语法
          sed 's|@EXEC@|/usr/bin/true|' packaging/rkdevtool.desktop > /tmp/check.desktop
          desktop-file-validate /tmp/check.desktop

      - name: 打包 deb
        run: |
          # 闭源的 upgrade_tool 不随代码分发，CI 拿不到，故生成不含后端的包。
          # 需要完整自包含包的构建者在本机跑 packaging/build-deb.sh。
          chmod +x packaging/build-deb.sh
          SKIP_UPGRADE_TOOL=1 ./packaging/build-deb.sh

      - name: 校验 deb
        run: |
          DEB=$(ls dist/*.deb)
          echo "产物：$DEB"
          dpkg-deb --info "$DEB"
          # 校验 TryExec 指向的程序确实在包里，否则 GNOME 菜单不会有条目
          EXEC=$(dpkg-deb --fsys-tarfile "$DEB" \
                 | tar -xO ./usr/share/applications/rkdevtool.desktop \
                 | sed -n 's/^TryExec=//p')
          echo "TryExec=$EXEC"
          dpkg-deb --fsys-tarfile "$DEB" | tar -tf - | grep -qF "opt/rkdevtool/bin/rkdevtool-launch" \
            || { echo "::error::包内缺少启动器，TryExec 会失效：$EXEC"; exit 1; }
          desktop_file=$(mktemp --suffix=.desktop)
          dpkg-deb --fsys-tarfile "$DEB" | tar -xO ./usr/share/applications/rkdevtool.desktop > "$desktop_file"
          desktop-file-validate "$desktop_file"

      - name: 上传 deb
        uses: actions/upload-artifact@v7
        with:
          name: rkdevtool-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: 发布开发构建到 latest Release
        # 推 main/master 时更新名为 latest 的 Release，产物滚动替换。
        # make_latest: false，正式版才抢占 GitHub 的 "Latest" 标记。
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 开发构建 (latest)
          body: |
            由 Actions 自动构建，来源为 `${{ github.ref_name }}` 分支的
            commit `${{ github.sha }}`。

            > [!IMPORTANT]
            > **本包不含 Rockchip 官方闭源后端 `upgrade_tool`**
            > （闭源许可限制，不随代码分发）。安装后需自行放置后端，
            > 详见包内 `/opt/rkdevtool/share/rkdevtool/README-BACKEND.txt`，
            > 或参考仓库 README 的「放置后端工具」一节。

            ```bash
            sudo dpkg -i rkdevtool_2.93_amd64.deb
            ```

            每次推送到该分支都会覆盖上方的 deb 附件，只保留最新构建。
            需要自包含后端的完整包，请在本机运行 `packaging/build-deb.sh`。
          files: dist/*.deb
          fail_on_unmatched_files: true

      - name: 发布正式版 Release
        # 推 v* tag 时发布正式版，并标记为 GitHub 的 Latest release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            `${{ github.ref_name }}` 正式版，commit `${{ github.sha }}`。

            > [!IMPORTANT]
            > **本包不含 Rockchip 官方闭源后端 `upgrade_tool`**
            > （闭源许可限制，不随代码分发）。安装后需自行放置后端，
            > 详见包内 `/opt/rkdevtool/share/rkdevtool/README-BACKEND.txt`，
            > 或参考仓库 README 的「放置后端工具」一节。

            ```bash
            sudo dpkg -i $(ls rkdevtool_*.deb | head -1)
            ```
          files: dist/*.deb
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
